<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgrimaTube</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Agrima Yadav's career as a video channel. Clickbait titles, receipts in the description.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a familiar video-site shell (sticky header, channel banner, card grid, watch page + Up next rail).
   Colour rule: amber means voice. It appears only on the mic, the ON AIR lamp, "you said" and the Making-of. */
:root {
  --bg: #F3F4F6;
  --surface: #FFFFFF;
  --raise: #E9EBEF;
  --fg: #121419;
  --muted: #586070;
  --line: #D9DDE3;
  --link: #2440D8;
  --voice: #FFB020;
  --voice-ink: #7A4A00;
  --voice-soft: rgba(255, 176, 32, 0.18);
  --todo: #8A6BD1;
  --shadow: 0 1px 2px rgba(16, 20, 28, 0.06), 0 8px 24px rgba(16, 20, 28, 0.06);

  --f-display: 'Anton', 'Impact', 'Arial Narrow', sans-serif;
  --f-ui: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --r: 12px;
  --max: 1280px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0F12; --surface: #161A1F; --raise: #20252C; --fg: #EDEFF2; --muted: #9AA3B0; --line: #2A3038;
    --link: #93A6FF; --voice-ink: #FFC54D; --voice-soft: rgba(255, 176, 32, 0.14); --todo: #B49CF0;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0F12; --surface: #161A1F; --raise: #20252C; --fg: #EDEFF2; --muted: #9AA3B0; --line: #2A3038;
  --link: #93A6FF; --voice-ink: #FFC54D; --voice-soft: rgba(255, 176, 32, 0.14); --todo: #B49CF0;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4); color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--link); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.15; }
.wrap { max-width: var(--max); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.02em; }
.muted { color: var(--muted); }

/* ---------- Header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 16px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); font-weight: 800; font-size: 19px; letter-spacing: -0.02em; }
.onair { font-family: var(--f-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.12em; padding: 3px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); transition: background .2s, color .2s, box-shadow .2s; }
.onair.live { background: var(--voice); color: #1A1200; border-color: var(--voice); box-shadow: 0 0 0 4px var(--voice-soft); }
.search { display: flex; align-items: center; gap: 8px; max-width: 640px; width: 100%; justify-self: center; }
.field { flex: 1; min-width: 0; display: flex; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px 0 16px; height: 44px; }
.field:focus-within { border-color: var(--link); }
.field input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 15px; outline: none; }
.field input::placeholder { color: var(--muted); }
.field .go { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.field .go:hover { background: var(--raise); }
.mic { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; transition: background .2s; }
.mic:hover { background: var(--raise); }
.mic.live { background: var(--voice); border-color: var(--voice); color: #1A1200; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px var(--voice-soft); } }
.sub { border: 0; border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 600; padding: 0 18px; height: 40px; cursor: pointer; white-space: nowrap; }
.sub.done { background: var(--raise); color: var(--fg); }
.voicehint { grid-column: 1 / -1; justify-self: center; max-width: 640px; width: 100%; font-size: 13px; color: var(--voice-ink); background: var(--voice-soft); border-radius: 8px; padding: 6px 12px; }

/* ---------- Channel banner ---------- */
.banner { padding-block: 28px 0; }
.chan { display: flex; gap: 20px; align-items: center; }
.avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; object-position: 50% 22%; flex: none; background: var(--raise); }
.avatar.sm { width: 40px; height: 40px; }
.chan h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 800; letter-spacing: -0.02em; }
.chan p { margin: 4px 0 0; max-width: 62ch; }
.tabs { display: flex; gap: 4px; margin-top: 20px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs a { padding: 10px 14px; text-decoration: none; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--fg); border-color: var(--fg); }

main { padding-block: 24px 64px; }
.section-h { display: flex; align-items: baseline; gap: 12px; margin: 36px 0 14px; }
.section-h h2 { font-size: 20px; font-weight: 800; }

/* ---------- Thumbnails (their own visual world, same in both themes) ---------- */
.thumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: var(--r); overflow: hidden; container-type: inline-size; isolation: isolate; }
.thumb.vert { aspect-ratio: 9 / 16; }
.thumb > img.full { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.t-ink { background: #1B33D6; color: #fff; }
.t-mint { background: #0E9F7A; color: #fff; }
.t-pink { background: #FF3F86; color: #fff; }
.t-sky { background: #2A9DF4; color: #fff; }
.t-black { background: #15171C; color: #fff; }
.t-cream { background: #F2E7CF; color: #17130B; }
.t-violet { background: #5B2EE0; color: #fff; }
.t-voice { background: #FFB020; color: #160F00; }
.thumb .num { position: absolute; left: 5cqw; top: 5cqw; display: flex; align-items: center; gap: 2cqw; font-family: var(--f-display); font-size: 25cqw; line-height: .95; letter-spacing: -0.01em; white-space: nowrap; z-index: 2; text-shadow: 0 .6cqw 0 rgba(0,0,0,.18); }
.thumb .num.l { font-size: 19cqw; }
.thumb .num.xl { font-size: 15cqw; }
.thumb .num .n { position: relative; display: inline-block; }
.thumb .words { position: absolute; left: 5cqw; bottom: 6cqw; font-family: var(--f-display); font-size: 8.4cqw; line-height: 1.22; max-width: 56cqw; z-index: 2; }
.thumb .words span { background: currentColor; padding: .4cqw 1.6cqw; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.thumb .words span b { font-weight: inherit; mix-blend-mode: normal; }
.t-cream .words span, .t-voice .words span { background: #111; }
.t-cream .words b, .t-voice .words b { color: #fff; }
.thumb:not(.t-cream):not(.t-voice) .words span { background: #fff; }
.thumb:not(.t-cream):not(.t-voice) .words b { color: #111; }
.thumb .face { position: absolute; right: -3cqw; bottom: -6cqw; width: 46cqw; aspect-ratio: 1; border-radius: 50%; object-fit: cover; object-position: 50% 20%; border: 1.4cqw solid #fff; z-index: 1; }
.thumb .badge { position: absolute; right: 3cqw; top: 3cqw; font-family: var(--f-mono); font-weight: 600; font-size: max(9px, 3cqw); letter-spacing: .1em; padding: .8cqw 1.6cqw; border-radius: 1cqw; background: rgba(0,0,0,.72); color: #fff; z-index: 3; }
.thumb .len { position: absolute; right: 3cqw; bottom: 3cqw; font-family: var(--f-mono); font-size: max(10px, 2.3cqw); padding: .4cqw 1.2cqw; border-radius: 1cqw; background: rgba(0,0,0,.8); color: #fff; z-index: 3; }
.thumb svg.doodle { flex: none; pointer-events: none; overflow: visible; }
.thumb svg.doodle.arrow { width: .6em; height: .4em; }
.thumb svg.doodle.q { width: .3em; height: .5em; }
.thumb svg.doodle.circle { position: absolute; left: -14%; top: -16%; width: 128%; height: 130%; }
.thumb.vert .num { font-size: 30cqw; top: 8cqw; }
.thumb.vert .words { font-size: 11cqw; max-width: 90cqw; bottom: auto; top: 46cqw; }
.thumb.vert .face { width: 78cqw; right: 11cqw; bottom: -14cqw; }
.thumb.vert svg.doodle { display: none; }

/* ---------- Cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 28px 18px; }
.card { display: grid; gap: 10px; text-decoration: none; color: var(--fg); min-width: 0; }
.card .thumb { transition: transform .2s ease; }
.card:hover .thumb { transform: translateY(-3px); }
.card .meta { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; }
.card .meta .avatar { width: 36px; height: 36px; }
.card h3 { font-size: 16px; font-weight: 700; line-height: 1.3; }
.card .stat { font-size: 13px; color: var(--muted); margin-top: 2px; }
.shorts { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(170px, 220px); gap: 14px; overflow-x: auto; padding-bottom: 8px; }
.shorts .card h3 { font-size: 14px; }

.featured { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: center; text-decoration: none; color: var(--fg); }
.featured h2 { font-size: clamp(22px, 2.6vw, 30px); font-weight: 800; letter-spacing: -0.015em; }
.featured p { margin: 10px 0 0; max-width: 52ch; }
.tag-feat { display: inline-block; font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .1em; padding: 3px 8px; border-radius: 4px; background: var(--fg); color: var(--bg); margin-bottom: 12px; }
.tag-voice { display: inline-block; font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .1em; padding: 3px 8px; border-radius: 4px; background: var(--voice); color: #1A1200; margin-bottom: 12px; }

/* ---------- Watch page ---------- */
.watch { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start; }
.player { border-radius: var(--r); overflow: hidden; position: relative; }
.player video { width: 100%; display: block; aspect-ratio: 16 / 9; background: #000; }
.player .overlay { position: absolute; inset: auto 0 0 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; background: linear-gradient(transparent, rgba(0,0,0,.75)); color: #fff; z-index: 4; }
.player .overlay button { border: 0; border-radius: 999px; background: #fff; color: #111; font-weight: 700; padding: 8px 16px; cursor: pointer; }
.watch h1 { font-size: clamp(20px, 2.4vw, 26px); font-weight: 800; letter-spacing: -0.01em; margin-top: 16px; }
.owner { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.owner .who { display: grid; }
.owner .who b { font-weight: 700; }
.owner .sub { margin-left: 8px; }
.desc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; margin-top: 16px; }
.desc .statline { font-weight: 700; }
.desc .hook { font-size: 17px; margin: 6px 0 14px; max-width: 68ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; text-decoration: none; color: var(--fg); display: inline-flex; gap: 8px; align-items: baseline; }
.chip:hover { background: var(--raise); }
.chip .mono { color: var(--muted); }
.chapter { margin-top: 22px; scroll-margin-top: 90px; max-width: 68ch; }
.chapter h3 { font-size: 15px; font-weight: 700; display: flex; gap: 10px; align-items: baseline; }
.chapter p, .chapter ul { margin: 6px 0 0; }
.chapter ul { padding-left: 20px; display: grid; gap: 4px; }
.todo { border: 1.5px dashed var(--todo); color: var(--todo); border-radius: 8px; padding: 8px 12px; margin-top: 6px; font-size: 14px; }
.todo::before { content: "To write: "; font-weight: 700; }
.receipt { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.comments { margin-top: 24px; }
.comments h2 { font-size: 18px; font-weight: 800; }
.comments p { margin: 8px 0 0; }
.rail { display: grid; gap: 14px; }
.rail h2 { font-size: 15px; font-weight: 700; }
.mini { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 10px; text-decoration: none; color: var(--fg); }
.mini h3 { font-size: 14px; font-weight: 700; line-height: 1.3; }
.mini .stat { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* ---------- Search results ---------- */
.heard { background: var(--voice-soft); border-radius: var(--r); padding: 14px 18px; display: grid; gap: 8px; }
.heard .said { font-size: 17px; }
.heard .said b { color: var(--voice-ink); }
.heard .chips .chip { background: var(--surface); cursor: default; }
.results { display: grid; gap: 20px; margin-top: 22px; }
.result { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 18px; text-decoration: none; color: var(--fg); }
.result h3 { font-size: 18px; font-weight: 700; }
.result .why { font-size: 13px; color: var(--muted); margin-top: 6px; }
.best { display: inline-block; font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .08em; padding: 2px 8px; border-radius: 4px; background: var(--voice); color: #1A1200; margin-bottom: 6px; }

/* ---------- About + Community ---------- */
.prose { max-width: 68ch; }
.beats { display: grid; gap: 0; margin-top: 18px; max-width: 760px; }
.beat { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 18px; padding: 16px 0; border-top: 1px solid var(--line); }
.beat h3 { font-size: 17px; font-weight: 700; }
.beat p { margin: 4px 0 0; }
.beat.next h3 { color: var(--voice-ink); }
.fine { margin-top: 30px; max-width: 760px; }
.fine ul { padding-left: 20px; display: grid; gap: 4px; }
.post { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; max-width: 720px; box-shadow: var(--shadow); }
.post .pin { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.post .owner { margin-top: 8px; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; margin: 16px 0 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.copy { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 2px 8px; font-size: 12px; cursor: pointer; margin-left: 6px; }

footer { border-top: 1px solid var(--line); padding-block: 20px; color: var(--muted); font-size: 13px; }

/* ---------- Responsive ---------- */
@media (max-width: 1000px) {
  .watch { grid-template-columns: minmax(0, 1fr); }
  .featured { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .top .wrap { grid-template-columns: minmax(0, 1fr) auto; }
  .search { grid-column: 1 / -1; grid-row: 2; }
  .brand { font-size: 17px; }
  .result { grid-template-columns: minmax(0, 1fr); }
  .mini { grid-template-columns: 140px minmax(0, 1fr); }
  .chan { align-items: flex-start; }
  .avatar { width: 72px; height: 72px; }
  .beat { grid-template-columns: minmax(0, 1fr); gap: 4px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

</style>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <a class="brand" href="#home">AgrimaTube <span class="onair" id="onair" aria-hidden="true">ON AIR</span></a>
    <form class="search" id="searchform" role="search">
      <label class="field" for="q">
        <input id="q" type="search" autocomplete="off" aria-label="Search by voice or text">
        <button class="go" type="submit" aria-label="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      </label>
      <button class="mic" id="mic" type="button" aria-label="Search with your voice"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    </form>
    <a class="sub" href="https://www.linkedin.com/in/agrima-yadav-69629b135/" target="_blank" rel="noopener" title="Follow Agrima on LinkedIn" style="display:inline-grid;place-items:center;text-decoration:none">Subscribe</a>
    <div class="voicehint" id="hint" role="status" hidden></div>
  </div>
</header>

<main class="wrap" id="main"></main>

    else if (s.length > 3 && s.endsWith('s') && !s.endsWith('ss')) s = s.slice(0, -1);
    if (s.length > 3 && s.at(-1) === s.at(-2) && !'lsz'.includes(s.at(-1))) s = s.slice(0, -1);
    return s;
  };

  const norm = q => q.toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9₹$%+\s-]/g, ' ').replace(/-/g, ' ').replace(/\s+/g, ' ').trim();

  // Pre-stem every keyword once.
  const INDEX = VIDEOS.map(v => {
    const kw = new Map();
    for (const [k, w] of Object.entries(v.keywords)) kw.set(stem(k), Math.max(w, kw.get(stem(k)) || 0));
    return { v, kw, phrases: v.phrases.map(norm) };
  });

  function search(raw) {
    const q = norm(raw);
    const terms = q.split(' ').filter(t => t && !STOP.has(t));
    const looked = [...new Set(terms)];
    const scored = INDEX.map(({ v, kw, phrases }) => {
      let score = 0;
      const hits = [];
      for (const t of looked) {
        const w = kw.get(stem(t));
        if (w) { score += w; hits.push(t); }
      }
      const phrase = phrases.find(p => q.includes(p));
      if (phrase) { score += 4; hits.unshift(`“${phrase}”`); }
      return { v, score, hits };
    }).filter(r => r.score > 0).sort((a, b) => b.score - a.score);
    return { query: raw.trim(), looked, results: scored };
  }

  const SUGGESTIONS = [
    'why did she do an MBA?',
    'is she funny?',
    'how does she handle senior people?',
    'is she technical?',
    'did she ever build a community?',
    'can she sell?',
  ];

  return { CHANNEL, VIDEOS, search, SUGGESTIONS };
})();



</script>
<script>
// Rendering, routing and the voice layer. Depends on AT (core.js), PHOTO (old CSS thumbnails) and AVATAR (profile photo), both inlined by build.py.
(() => {
  const { CHANNEL, VIDEOS, search, SUGGESTIONS } = AT;
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const byId = id => VIDEOS.find(v => v.id === id);
  const videos = VIDEOS.filter(v => v.kind === 'video');
  const shorts = VIDEOS.filter(v => v.kind === 'short');
  const TABS = ['home', 'videos', 'shorts', 'about', 'community'];

  const ICON = {
    search: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    mic: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
    pin: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 17v5M8 3h8l-1 7 3 3H6l3-3z"/></svg>',
  };
  // Hand-drawn marks for thumbnails; they take the thumbnail's text colour.
  const DOODLE = {
    arrow: '<svg class="doodle arrow" viewBox="0 0 60 40" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M56 30C40 34 22 30 10 14"/><path d="M8 28 9 12l15 2"/></svg>',
    circle: '<svg class="doodle circle" viewBox="0 0 100 60" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M60 6C30 2 4 12 5 30s30 26 55 24 37-14 35-28S70 2 40 9"/></svg>',
    q: '<svg class="doodle q" viewBox="0 0 30 50" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" aria-hidden="true"><path d="M6 14C6 6 12 3 17 3s9 4 9 10c0 8-11 9-11 19"/><circle cx="15" cy="44" r="2.5" fill="currentColor"/></svg>',
  };

  function thumb(v, vert = false) {
    const t = v.thumb;
    if (t.img) return `<div class="thumb${vert ? ' vert' : ''}"><img class="full" src="${THUMBS[t.img] || esc(t.img)}" alt="${esc(v.title)}">${vert ? '' : `<span class="len">${esc(v.length.replace(' read', '').toUpperCase())}</span>`}</div>`;
    const size = t.num.length >= 6 ? ' xl' : t.num.length >= 5 ? ' l' : '';
    const circle = t.doodle === 'circle' ? DOODLE.circle : '';
    const after = t.doodle === 'arrow' || t.doodle === 'q' ? DOODLE[t.doodle] : '';
    return `<div class="thumb t-${t.tone}${vert ? ' vert' : ''}" role="img" aria-label="${esc(v.title)}">
      <div class="num${size}"><span class="n">${esc(t.num)}${circle}</span>${after}</div>
      <div class="words"><span><b>${esc(t.words)}</b></span></div>
      <img class="face" src="${PHOTO}" alt="">
      <span class="badge">${esc(v.badge)}</span>
    </div>`;
  }

  const card = (v, vert = false) => `<a class="card" href="#${v.id}">
      ${thumb(v, vert)}
      ${vert ? `<div><h3>${esc(v.title)}</h3><div class="stat">${esc(v.stat)}</div></div>` :
      `<div class="meta"><img class="avatar" src="${AVATAR}" alt=""><div><h3>${esc(v.title)}</h3><div class="stat">${esc(v.stat)}</div><div class="stat">${esc(v.length)}</div></div></div>`}
    </a>`;

  const mini = v => `<a class="mini" href="#${v.id}">${thumb(v)}<div><h3>${esc(v.title)}</h3><div class="stat">${esc(v.stat)}</div></div></a>`;

  const subscribe = `<a class="sub" href="${CHANNEL.linkedin}" target="_blank" rel="noopener" title="Follow Agrima on LinkedIn" style="display:inline-grid;place-items:center;text-decoration:none">Subscribe</a>`;

  // ---------- Channel pages ----------
  function banner(tab) {
    return `<section class="banner"><div class="chan">
        <img class="avatar" src="${AVATAR}" alt="Agrima Yadav">
        <div><h1>${esc(CHANNEL.name)}</h1>
          <div class="muted">${esc(CHANNEL.handle)} · ${videos.length} videos · ${shorts.length} Shorts · ${esc(CHANNEL.role)}</div>
          <p>${esc(CHANNEL.tagline)}</p></div>
      </div>
      <nav class="tabs" aria-label="Channel">${TABS.map(t => `<a href="#${t}"${t === tab ? ' aria-current="page"' : ''}>${t[0].toUpperCase() + t.slice(1)}</a>`).join('')}</nav>
    </section>`;
  }

  function homeTab() {
    const f = VIDEOS.find(v => v.featured);
    return `<a class="featured" href="#${f.id}">${thumb(f)}
        <div><span class="tag-feat">FEATURED</span><h2>${esc(f.title)}</h2><p>${esc(f.hook)}</p>
        <p class="muted">${esc(f.stat)} · ${esc(f.length)}</p></div></a>
      <div class="section-h"><h2>Videos</h2><span class="muted">Clickbait titles. Receipts in the description.</span></div>
      <div class="grid">${videos.filter(v => !v.featured).map(v => card(v)).join('')}</div>
      <div class="section-h"><h2>Shorts</h2><span class="muted">The fun side</span></div>
      <div class="shorts">${shorts.map(v => card(v, true)).join('')}</div>`;
  }

  function aboutTab() {
    const beat = (when, h, p, cls = '') => `<div class="beat ${cls}"><div class="mono muted">${when}</div><div><h3>${h}</h3><p>${p}</p></div></div>`;
    return `<div class="section-h"><h2>Previously on…</h2></div>
      <div class="beats">
        ${beat('2019 – 2022', 'The banker', 'Investment banking analyst at J.P. Morgan, Mumbai. Automated her own deal material by 80%, got a fast-track promotion (top 10%) and was recommended for the London team.')}
        ${beat('2022 – 2024', 'The plot twist', 'An MBA at IIM Bangalore. National winner at Datamatrix (290+ teams) and Terra Nullius (70+ teams), runner-up at Paramarsh (650+ teams), and stand-up champion on the side.')}
        ${beat('2023', 'The consultant', 'Summer associate at Bain & Company. Found ₹10 Cr in revenue potential for a biopharma client by benchmarking 10+ rivals.')}
        ${beat('2024 – now', 'The PM', 'Product Manager 2 at Microsoft, Azure Native Integrations, CoreAI. Three partner launches with Commvault, Everpure and Dell.')}
      </div>
      <div class="fine"><div class="section-h"><h2>The fine print</h2><span class="muted">Credentials live here, not in the titles</span></div>
        <ul>
          <li>MBA (PGP), Indian Institute of Management Bangalore, 2022 – 2024</li>
          <li>B.E. Information Technology, Netaji Subhas Institute of Technology, 2015 – 2019</li>
          <li>GMAT 770/800, top 1% globally</li>
          <li>ISB Merit Scholarship 2022, ₹5 L, top 40 of 840+ admits</li>
          <li>Published research on deep learning in agriculture, IGI Global International (2019)</li>
        </ul></div>`;
  }

  function communityTab() {
    return `<div class="section-h"><h2>Community</h2></div>
      <article class="post">
        <div class="pin">${ICON.pin} Pinned by ${esc(CHANNEL.name)}</div>
        <div class="owner"><img class="avatar sm" src="${AVATAR}" alt=""><div class="who"><b>${esc(CHANNEL.name)}</b><span class="muted mono">pinned post</span></div></div>
        <p>Hi Wispr team. Here are the logistics, so you don't have to dig.</p>
        <dl class="facts">
          <dt>Based in</dt><dd>${esc(CHANNEL.city)}</dd>
          <dt>Email</dt><dd><span id="email">${esc(CHANNEL.email)}</span><button class="copy" type="button" data-copy="${esc(CHANNEL.email)}">Copy</button></dd>
          <dt>LinkedIn</dt><dd><a href="${CHANNEL.linkedin}" target="_blank" rel="noopener">agrima-yadav</a></dd>
        </dl>
      </article>`;
  }

  function channel(tab) {
    const body = {
      home: homeTab,
      videos: () => `<div class="section-h"><h2>All videos</h2></div><div class="grid">${videos.map(v => card(v)).join('')}</div>`,
      shorts: () => `<div class="section-h"><h2>Shorts</h2></div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">${shorts.map(v => card(v, true)).join('')}</div>`,
      about: aboutTab,
      community: communityTab,
    }[tab]();
    return banner(tab) + body;
  }

  // ---------- Watch page ----------
  function watch(v) {
    const pad = i => String(i + 1).padStart(2, '0');
    const chapters = v.chapters.filter(c => !c.todo);
    const player = v.videoSrc
      ? `<video controls playsinline src="${esc(v.videoSrc)}"></video>`
      : `${thumb(v)}<div class="overlay"><span class="mono">${v.kind === 'short' ? 'Short' : 'Episode · ' + esc(v.length)}</span><button type="button" data-jump="ch-0">Start reading</button></div>`;
    const chapter = (c, i) => `<section class="chapter" id="ch-${i}"><h3><span class="mono muted">${pad(i)}</span>${esc(c.label)}</h3>
        ${c.text ? `<p>${esc(c.text)}</p>` : ''}
        ${c.bullets ? `<ul>${c.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}</section>`;
    const next = VIDEOS.filter(x => x.id !== v.id);
    return `<div class="watch">
      <div>
        <div class="player">${player}</div>
        <h1>${esc(v.title)}</h1>
        <div class="owner"><img class="avatar sm" src="${AVATAR}" alt=""><div class="who"><b>${esc(CHANNEL.name)}</b><span class="muted" style="font-size:13px">${esc(CHANNEL.role)}</span></div>${subscribe}</div>
        <div class="desc">
          <div class="statline">${esc(v.stat)}</div>
          <p class="hook">${esc(v.hook)}</p>
          <div class="chips">${chapters.map((c, i) => `<button type="button" class="chip" data-jump="ch-${i}"><span class="mono">${pad(i)}</span>${esc(c.label)}</button>`).join('')}</div>
          ${chapters.map(chapter).join('')}
          <div class="receipt">Receipt: ${esc(v.receipt)}</div>
        </div>
        <div class="comments"><h2>Comments</h2>
          <p class="muted">Comments are turned off for this video. Talk to her instead: <span>${esc(CHANNEL.email)}</span><button class="copy" type="button" data-copy="${esc(CHANNEL.email)}">Copy</button> or <a href="${CHANNEL.linkedin}" target="_blank" rel="noopener">LinkedIn</a>.</p></div>
      </div>
      <aside class="rail"><h2>Up next</h2>${next.map(mini).join('')}</aside>
    </div>`;
  }

  // ---------- Search results ----------
  let last = null;
  function results() {
    if (!last) return channel('home');
    const { query, looked, results: rs, via } = last;
    const verb = via === 'typed' ? 'You searched' : 'You said';
    const how = via === 'dictated' ? ' <span class="mono muted">· dictated, nice</span>' : via === 'spoken' ? ' <span class="mono muted">· heard by the mic</span>' : '';
    const head = `<div class="heard"><div class="said">${verb}: <b>“${esc(query)}”</b>${how}</div>
      ${looked.length ? `<div class="chips"><span class="muted" style="font-size:13px;align-self:center">Looking for</span>${looked.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : ''}</div>`;
    if (!rs.length) {
      const picks = VIDEOS.filter(v => ['four-teams', 'hundred-million', 'stand-up'].includes(v.id));
      return `${head}<div class="section-h"><h2>Nothing matched that one</h2></div>
        <div class="chips"><span class="muted" style="align-self:center">Try saying</span>${SUGGESTIONS.slice(0, 3).map(s => `<button type="button" class="chip" data-say="${esc(s)}">${esc(s)}</button>`).join('')}</div>
        <div class="section-h"><h2>Start with these</h2></div><div class="grid">${picks.map(v => card(v)).join('')}</div>`;
    }
    return `${head}<div class="results">${rs.map((r, i) => `<a class="result" href="#${r.v.id}">${thumb(r.v)}
        <div>${i === 0 ? '<span class="best">BEST MATCH</span>' : ''}<h3>${esc(r.v.title)}</h3>
        <div class="stat muted" style="margin-top:4px">${esc(r.v.stat)}</div>
        <div class="why">Matched on ${r.hits.map(h => `<b>${esc(h)}</b>`).join(', ')}</div></div></a>`).join('')}</div>`;
  }

  // ---------- Router ----------
  function route() {
    const id = location.hash.slice(1) || 'home';
    const v = byId(id);
    $('#main').innerHTML = v ? watch(v) : id === 'results' ? results() : channel(TABS.includes(id) ? id : 'home');
    document.title = v ? `${v.title} · ${CHANNEL.site}` : CHANNEL.site;
    window.scrollTo(0, 0);
  }

  // ---------- Voice layer ----------
  const input = $('#q'), lamp = $('#onair'), hint = $('#hint'), micBtn = $('#mic');
  let via = 'typed', idle, hintTimer, lampTimer;

  const light = on => lamp.classList.toggle('live', on);
  const flash = ms => { light(true); clearTimeout(lampTimer); lampTimer = setTimeout(() => light(false), ms); };
  function say(msg) {
    hint.innerHTML = msg; hint.hidden = false;
    clearTimeout(hintTimer); hintTimer = setTimeout(() => { hint.hidden = true; }, 7000);
  }

  function run(text, how) {
    if (!text.trim()) return;
    last = { ...search(text), via: how };
    if (location.hash === '#results') route(); else location.hash = 'results';
  }

  $('#searchform').addEventListener('submit', e => { e.preventDefault(); clearTimeout(idle); run(input.value, via); });

  // Wispr Flow (and other dictation) drops a whole phrase in at once. Treat a burst as speech:
  // light the lamp and search on a short pause, because people who talk don't press Enter.
  let prevLen = 0;
  input.addEventListener('input', e => {
    const jump = input.value.length - prevLen;
    prevLen = input.value.length;
    const burst = e.inputType === 'insertFromPaste' || e.inputType === 'insertReplacementText' || (e.data && e.data.length > 3) || jump > 5;
    if (burst) { via = 'dictated'; flash(1600); }
    if (!input.value) via = 'typed';
    clearTimeout(idle);
    if (via === 'dictated') idle = setTimeout(() => run(input.value, 'dictated'), 800);
  });

  // Browser mic for visitors without Wispr Flow.
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;
  micBtn.addEventListener('click', () => {
    if (!SR) return say('This browser can’t listen. Press your <b>Wispr Flow</b> hotkey and talk into the search box, or type.');
    if (listening) return rec.stop();
    rec = new SR();
    rec.lang = 'en-IN'; rec.interimResults = true; rec.maxAlternatives = 1;
    let heard = '';
    rec.onstart = () => { listening = true; micBtn.classList.add('live'); light(true); input.value = ''; say('Listening. Ask anything, like “why did she do an MBA?”'); };
    rec.onresult = e => { heard = Array.from(e.results).map(r => r[0].transcript).join(' '); input.value = heard; prevLen = heard.length; };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') say('Mic access is blocked here. Press your <b>Wispr Flow</b> hotkey and talk into the search box, or type.');
      else if (e.error === 'no-speech') say('Didn’t catch that. Tap the mic and try again.');
    };
    rec.onend = () => { listening = false; micBtn.classList.remove('live'); light(false); if (heard) run(heard, 'spoken'); };
    try { rec.start(); } catch { say('Mic didn’t start. Press your <b>Wispr Flow</b> hotkey or type.'); }
  });

  // Placeholder that teaches the kind of question to ask.
  let p = 0;
  const setPh = () => { input.placeholder = `Try saying “${SUGGESTIONS[p++ % SUGGESTIONS.length]}”`; };
  setPh();
  setInterval(() => { if (document.activeElement !== input && !input.value) setPh(); }, 4000);

  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== input && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); input.focus(); }
  });

  document.addEventListener('click', e => {
    const jump = e.target.closest('[data-jump]');
    if (jump) { document.getElementById(jump.dataset.jump)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    const sayBtn = e.target.closest('[data-say]');
    if (sayBtn) { input.value = sayBtn.dataset.say; run(sayBtn.dataset.say, 'typed'); return; }
    const copy = e.target.closest('[data-copy]');
    if (copy) {
      const done = () => { copy.textContent = 'Copied'; setTimeout(() => { copy.textContent = 'Copy'; }, 1500); };
      try { navigator.clipboard.writeText(copy.dataset.copy).then(done, () => window.getSelection().selectAllChildren(copy.previousElementSibling)); }
      catch { window.getSelection().selectAllChildren(copy.previousElementSibling); }
    }
  });

  window.addEventListener('hashchange', route);
  route();
})();

</script>
